<style>
  :root {
    --sky: #2b6cb8;
    --pine: #0e6b3a;
    --ink: #14263a;
    --muted: #51657a;
    --bg: #f4f8fc;
    --bg-2: #e3eef9;
    --hill: #0e6b3a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eaf2fb;
      --muted: #a3b6ca;
      --bg: #0c1a2a;
      --bg-2: #12304f;
      --sky: #7db4ee;
      --pine: #5fbf8a;
      --hill: #1c7a4a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 70%);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px 160px;
    position: relative;
    z-index: 1;
  }
  .logo {
    width: clamp(120px, 22vw, 168px);
    height: auto;
    margin-bottom: 36px;
    animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both;
  }
  h1 {
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    font-weight: 500;
    font-size: clamp(2rem, 5.5vw, 3.4rem);
    line-height: 1.12;
    letter-spacing: -0.01em;
    max-width: 16ch;
    text-wrap: balance;
  }
  p {
    margin-top: 20px;
    max-width: 44ch;
    font-size: clamp(1rem, 2.2vw, 1.125rem);
    line-height: 1.6;
    color: var(--muted);
  }
  .contact {
    margin-top: 32px;
    font-size: 0.95rem;
    color: var(--muted);
  }
  .contact a {
    color: var(--sky);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
  }
  .contact a:hover { color: var(--pine); }
  a:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; border-radius: 2px; }
  .hills {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    width: 100%;
    height: clamp(110px, 20vw, 190px);
    display: block;
    z-index: 0;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo { animation: none; }
  }
</style>
</head>
